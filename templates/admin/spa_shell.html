<!-- 1. TEMPLATE DASHBOARD -->
<template id="tpl-byt3lab-dashboard">
  <div class="byt3lab-dashboard-view">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
      <div>
        <h1 class="h3 fw-bold mb-1" style="color: var(--ds-color-text, #0f172a);">
          {{ t('admin_title', 'BYT3LAB Contenu — Console Éditoriale') }}
        </h1>
        <p class="text-muted small mb-0">Pilotage institutionnel et éditorial du groupe Byt3Lab</p>
      </div>
      <div class="d-flex gap-2">
        <a href="/" target="_blank" class="ds-btn ds-btn-outline-secondary">
          <span>{{ t('admin_view_public_site', 'Voir le site public') }} &rarr;</span>
        </a>
        <button type="button" class="ds-btn ds-btn-primary" @click="goTo('/settings')">
          {{ t('admin_settings', 'Réglages du site') }}
        </button>
      </div>
    </div>

    <!-- Bannière alertes messages non lus -->
    <div v-if="counts.unread_messages > 0" class="alert alert-success d-flex justify-content-between align-items-center mb-4 shadow-sm">
      <div class="d-flex align-items-center gap-2">
        <span class="badge bg-success rounded-pill px-2 py-1">!</span>
        <div>
          <strong>[[ counts.unread_messages ]] nouveau(x) message(s) non lu(s)</strong>
          <div class="small">Des demandes de contact ou de partenariat attendent votre traitement.</div>
        </div>
      </div>
      <button type="button" class="ds-btn ds-btn-sm ds-btn-primary" @click="goTo('/inbox')">
        Consulter &rarr;
      </button>
    </div>

    <!-- Grille des KPIs -->
    <div class="row g-3 mb-4">
      <div class="col-sm-6 col-md-4 col-xl-3">
        <div class="ds-card p-3 shadow-sm h-100" style="cursor: pointer;" @click="goTo('/inbox')">
          <div class="text-muted small fw-bold text-uppercase">📥 Boîte de Réception</div>
          <div class="fs-2 fw-bold my-1" style="color: var(--ds-color-primary, #002A4E);">[[ counts.messages || 0 ]]</div>
          <div class="small text-muted">[[ counts.unread_messages || 0 ]] non lus</div>
        </div>
      </div>
      <div class="col-sm-6 col-md-4 col-xl-3">
        <div class="ds-card p-3 shadow-sm h-100" style="cursor: pointer;" @click="goTo('/divisions')">
          <div class="text-muted small fw-bold text-uppercase">🏛️ Divisions</div>
          <div class="fs-2 fw-bold my-1">[[ counts.divisions || 0 ]]</div>
          <div class="small text-muted">Axes fondateurs</div>
        </div>
      </div>
      <div class="col-sm-6 col-md-4 col-xl-3">
        <div class="ds-card p-3 shadow-sm h-100" style="cursor: pointer;" @click="goTo('/solutions')">
          <div class="text-muted small fw-bold text-uppercase">🚀 Solutions & Produits</div>
          <div class="fs-2 fw-bold my-1">[[ counts.solutions || 0 ]]</div>
          <div class="small text-muted">MELODI, SUKU, BWS</div>
        </div>
      </div>
      <div class="col-sm-6 col-md-4 col-xl-3">
        <div class="ds-card p-3 shadow-sm h-100" style="cursor: pointer;" @click="goTo('/services')">
          <div class="text-muted small fw-bold text-uppercase">🛠️ Services</div>
          <div class="fs-2 fw-bold my-1">[[ counts.services || 0 ]]</div>
          <div class="small text-muted">Offres d'ingénierie</div>
        </div>
      </div>
      <div class="col-sm-6 col-md-4 col-xl-3">
        <div class="ds-card p-3 shadow-sm h-100" style="cursor: pointer;" @click="goTo('/projects')">
          <div class="text-muted small fw-bold text-uppercase">💼 Portfolio (Projets)</div>
          <div class="fs-2 fw-bold my-1">[[ counts.projects || 0 ]]</div>
          <div class="small text-muted">Études de cas</div>
        </div>
      </div>
      <div class="col-sm-6 col-md-4 col-xl-3">
        <div class="ds-card p-3 shadow-sm h-100" style="cursor: pointer;" @click="goTo('/partners')">
          <div class="text-muted small fw-bold text-uppercase">🤝 Partenaires</div>
          <div class="fs-2 fw-bold my-1">[[ counts.partners || 0 ]]</div>
          <div class="small text-muted">Alliances stratégiques</div>
        </div>
      </div>
      <div class="col-sm-6 col-md-4 col-xl-2">
        <div class="ds-card p-3 shadow-sm h-100" style="cursor: pointer;" @click="goTo('/team')">
          <div class="text-muted small fw-bold text-uppercase">👥 Équipe</div>
          <div class="fs-2 fw-bold my-1">[[ counts.team || 0 ]]</div>
          <div class="small text-muted">Pôles d'expertise</div>
        </div>
      </div>
      <div class="col-sm-6 col-md-4 col-xl-2">
        <div class="ds-card p-3 shadow-sm h-100" style="cursor: pointer;" @click="goTo('/jobs')">
          <div class="text-muted small fw-bold text-uppercase">🎯 Carrières</div>
          <div class="fs-2 fw-bold my-1">[[ counts.jobs || 0 ]]</div>
          <div class="small text-muted">Offres d'emploi</div>
        </div>
      </div>
      <div class="col-sm-6 col-md-4 col-xl-2">
        <div class="ds-card p-3 shadow-sm h-100" style="cursor: pointer;" @click="goTo('/posts')">
          <div class="text-muted small fw-bold text-uppercase">📰 Blog</div>
          <div class="fs-2 fw-bold my-1">[[ counts.posts || 0 ]]</div>
          <div class="small text-muted">Publications R&D</div>
        </div>
      </div>
    </div>

    <!-- Derniers messages reçus -->
    <div class="ds-card shadow-sm p-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h5 fw-bold mb-0">Dernières Demandes Reçues (Formulaires)</h2>
        <button type="button" class="ds-btn ds-btn-sm ds-btn-outline-primary" @click="goTo('/inbox')">
          Voir toute la boîte de réception &rarr;
        </button>
      </div>

      <div class="table-responsive" v-if="recentMessages && recentMessages.length > 0">
        <table class="table align-middle">
          <thead>
            <tr>
              <th>Date</th>
              <th>Type</th>
              <th>Expéditeur</th>
              <th>Organisation</th>
              <th>Objet</th>
              <th>Statut</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            <tr v-for="m in recentMessages" :key="m.id">
              <td class="small text-muted">[[ formatDate(m.created_at) ]]</td>
              <td>
                <span class="badge" :class="m.form_type === 'partner' ? 'bg-primary' : 'bg-secondary'">
                  [[ m.form_type.toUpperCase() ]]
                </span>
              </td>
              <td>
                <strong>[[ m.sender_name ]]</strong><br>
                <small class="text-muted">[[ m.email ]]</small>
              </td>
              <td>[[ m.organization || '—' ]]</td>
              <td>[[ m.subject || m.partner_type || '—' ]]</td>
              <td>
                <span v-if="m.status === 'new'" class="badge bg-success">Nouveau</span>
                <span v-else-if="m.status === 'in_progress'" class="badge bg-warning text-dark">En cours</span>
                <span v-else class="badge bg-light text-dark border">Traité</span>
              </td>
              <td>
                <button type="button" class="ds-btn ds-btn-sm ds-btn-secondary" @click="goTo('/inbox')">
                  Consulter
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <div v-else class="text-center text-muted py-4">
        Aucune demande reçue pour le moment.
      </div>
    </div>
  </div>
</template>

<!-- 2. TEMPLATE INBOX -->
<template id="tpl-byt3lab-inbox">
  <div class="byt3lab-inbox-view">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h1 class="h3 fw-bold mb-1">Boîte de Réception</h1>
        <p class="text-muted small mb-0">Demandes de contact et propositions de partenariat reçues</p>
      </div>
      <router-link to="/" class="ds-btn ds-btn-outline-secondary">
        &larr; Retour au tableau de bord
      </router-link>
    </div>

    <!-- Alertes Feedback -->
    <div v-if="successMessage" class="alert alert-success alert-dismissible fade show mb-3">
      [[ successMessage ]]
    </div>

    <!-- Détail d'un message sélectionné -->
    <div v-if="selectedMessage" class="ds-card p-4 shadow-sm mb-4 border-primary">
      <div class="d-flex justify-content-between align-items-start border-bottom pb-3 mb-3">
        <div>
          <span class="badge mb-2" :class="selectedMessage.form_type === 'partner' ? 'bg-primary' : 'bg-secondary'">
            FORMULAIRE [[ selectedMessage.form_type.toUpperCase() ]]
          </span>
          <h2 class="h4 fw-bold mb-1">[[ selectedMessage.subject || selectedMessage.partner_type || 'Sans objet' ]]</h2>
          <div class="small text-muted">Reçu le [[ formatDate(selectedMessage.created_at) ]] &bull; IP: [[ selectedMessage.ip_address || '—' ]]</div>
        </div>
        <div class="d-flex gap-2">
          <button type="button" class="ds-btn ds-btn-sm ds-btn-success" @click="updateStatus(selectedMessage.id, 'resolved')">
            Marquer Traité
          </button>
          <button type="button" class="ds-btn ds-btn-sm ds-btn-warning" @click="updateStatus(selectedMessage.id, 'in_progress')">
            En cours
          </button>
          <button type="button" class="ds-btn ds-btn-sm ds-btn-danger" @click="deleteMsg(selectedMessage.id)">
            Supprimer
          </button>
          <button type="button" id="btn-close-msg-modal" class="btn-close ms-2" @click="closeDetail"></button>
        </div>
      </div>

      <div class="row g-3 bg-light p-3 rounded mb-3">
        <div class="col-md-3">
          <small class="text-muted d-block">Expéditeur :</small>
          <strong>[[ selectedMessage.sender_name ]]</strong>
        </div>
        <div class="col-md-3">
          <small class="text-muted d-block">Organisation :</small>
          <strong>[[ selectedMessage.organization || 'Non spécifiée' ]]</strong>
        </div>
        <div class="col-md-3">
          <small class="text-muted d-block">E-mail :</small>
          <a :href="'mailto:' + selectedMessage.email" class="fw-bold">[[ selectedMessage.email ]]</a>
        </div>
        <div class="col-md-3">
          <small class="text-muted d-block">Téléphone :</small>
          <strong>[[ selectedMessage.phone || 'Non spécifié' ]]</strong>
        </div>
        <div class="col-md-3" v-if="selectedMessage.website">
          <small class="text-muted d-block">Site web :</small>
          <a :href="selectedMessage.website" target="_blank" rel="noopener noreferrer">[[ selectedMessage.website ]]</a>
        </div>
      </div>

      <div>
        <h5 class="fw-bold mb-2">Message détaillé :</h5>
        <div class="p-3 bg-white border rounded" style="white-space: pre-wrap; line-height: 1.6;">
          [[ selectedMessage.message ]]
        </div>
      </div>
    </div>

    <!-- Filtres & Tableau des messages -->
    <div class="ds-card p-4 shadow-sm">
      <div class="d-flex gap-2 border-bottom pb-3 mb-3">
        <button type="button" class="ds-btn ds-btn-sm" :class="activeFilter === '' ? 'ds-btn-primary' : 'ds-btn-outline-secondary'" @click="setFilter('')">
          Tous ([[ counts.total || 0 ]])
        </button>
        <button type="button" class="ds-btn ds-btn-sm" :class="activeFilter === 'new' ? 'ds-btn-primary' : 'ds-btn-outline-secondary'" @click="setFilter('new')">
          Nouveaux ([[ counts.new || 0 ]])
        </button>
        <button type="button" class="ds-btn ds-btn-sm" :class="activeFilter === 'in_progress' ? 'ds-btn-primary' : 'ds-btn-outline-secondary'" @click="setFilter('in_progress')">
          En cours ([[ counts.in_progress || 0 ]])
        </button>
        <button type="button" class="ds-btn ds-btn-sm" :class="activeFilter === 'resolved' ? 'ds-btn-primary' : 'ds-btn-outline-secondary'" @click="setFilter('resolved')">
          Traités ([[ counts.resolved || 0 ]])
        </button>
      </div>

      <div class="table-responsive" v-if="messages && messages.length > 0">
        <table class="table align-middle">
          <thead>
            <tr>
              <th>Date</th>
              <th>Type</th>
              <th>Expéditeur</th>
              <th>Organisation</th>
              <th>Objet / Type</th>
              <th>Statut</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            <tr v-for="m in messages" :key="m.id" :class="selectedMessage && selectedMessage.id === m.id ? 'table-primary' : ''">
              <td class="small text-muted">[[ formatDate(m.created_at) ]]</td>
              <td>
                <span class="badge" :class="m.form_type === 'partner' ? 'bg-primary' : 'bg-secondary'">
                  [[ m.form_type.toUpperCase() ]]
                </span>
              </td>
              <td>
                <strong>[[ m.sender_name ]]</strong><br>
                <small class="text-muted">[[ m.email ]]</small>
              </td>
              <td>[[ m.organization || '—' ]]</td>
              <td>[[ m.subject || m.partner_type || '—' ]]</td>
              <td>
                <span v-if="m.status === 'new'" class="badge bg-success">Nouveau</span>
                <span v-else-if="m.status === 'in_progress'" class="badge bg-warning text-dark">En cours</span>
                <span v-else class="badge bg-light text-dark border">Traité</span>
              </td>
              <td>
                <button type="button" class="ds-btn ds-btn-sm ds-btn-secondary btn-view-msg" @click="viewMessage(m)">
                  Ouvrir
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <div v-else class="text-center text-muted py-4">
        Aucun message dans cette catégorie.
      </div>
    </div>
  </div>
</template>

<!-- 3. TEMPLATE SETTINGS -->
<template id="tpl-byt3lab-settings">
  <div class="byt3lab-settings-view">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h1 class="h3 fw-bold mb-1">{{ t('admin_settings', 'Réglages Généraux du Site BYT3LAB') }}</h1>
        <p class="text-muted small mb-0">Textes clés, coordonnées, réseaux et mentions légales</p>
      </div>
      <router-link to="/" class="ds-btn ds-btn-outline-secondary">
        &larr; Retour au tableau de bord
      </router-link>
    </div>

    <div v-if="successMessage" class="alert alert-success alert-dismissible fade show mb-3">
      [[ successMessage ]]
    </div>

    <div class="ds-card p-4 shadow-sm">
      <div class="mb-4 pb-2 border-bottom" style="display: flex; flex-direction: row; flex-wrap: wrap; gap: 0.5rem;">
        <button type="button" class="ds-btn ds-btn-sm" :class="activeTab === 'contact' ? 'ds-btn-primary' : 'ds-btn-secondary'" @click="activeTab = 'contact'">
          📍 Coordonnées & Réseaux
        </button>
        <button type="button" class="ds-btn ds-btn-sm" :class="activeTab === 'hero' ? 'ds-btn-primary' : 'ds-btn-secondary'" @click="activeTab = 'hero'">
          ✨ Hero & Accueil
        </button>
        <button type="button" class="ds-btn ds-btn-sm" :class="activeTab === 'legal' ? 'ds-btn-primary' : 'ds-btn-secondary'" @click="activeTab = 'legal'">
          ⚖️ Mentions Légales & Footer
        </button>
      </div>

      <form @submit.prevent="submitForm">
        <!-- Tab 1: Coordonnées & Réseaux -->
        <div v-show="activeTab === 'contact'">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label fw-bold small">E-mail Principal :</label>
              <input type="email" class="form-control" v-model="form.contact_email_fr">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-bold small">E-mail Support :</label>
              <input type="email" class="form-control" v-model="form.contact_email_support_fr">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-bold small">Téléphone Principal :</label>
              <input type="text" class="form-control" v-model="form.contact_phone_fr">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-bold small">WhatsApp (numéro) :</label>
              <input type="text" class="form-control" v-model="form.contact_whatsapp_fr">
            </div>
            <div class="col-12">
              <label class="form-label fw-bold small">Présence Géographique :</label>
              <input type="text" class="form-control" v-model="form.contact_location_fr">
            </div>
          </div>

          <h5 class="fw-bold mt-4 mb-3 border-top pt-3">Liens Réseaux Sociaux</h5>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label fw-bold small">LinkedIn :</label>
              <input type="url" class="form-control" v-model="form.social_linkedin_fr">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-bold small">Facebook Byt3Lab :</label>
              <input type="url" class="form-control" v-model="form.social_facebook_fr">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-bold small">YouTube :</label>
              <input type="url" class="form-control" v-model="form.social_youtube_fr">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-bold small">Facebook NGRAFIX :</label>
              <input type="url" class="form-control" v-model="form.social_ngrafix_fr">
            </div>
          </div>
        </div>

        <!-- Tab 2: Hero & Accueil -->
        <div v-show="activeTab === 'hero'">
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label fw-bold small">Signature Hero :</label>
              <input type="text" class="form-control" v-model="form.home_hero_signature_fr">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-bold small">Titre Hero (FR) :</label>
              <input type="text" class="form-control" v-model="form.home_hero_title_fr">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-bold small">Titre Hero (EN) :</label>
              <input type="text" class="form-control" v-model="form.home_hero_title_en">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-bold small">Sous-titre (FR) :</label>
              <textarea class="form-control" rows="3" v-model="form.home_hero_subtitle_fr"></textarea>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-bold small">Sous-titre (EN) :</label>
              <textarea class="form-control" rows="3" v-model="form.home_hero_subtitle_en"></textarea>
            </div>
          </div>
        </div>

        <!-- Tab 3: Mentions Légales & Footer -->
        <div v-show="activeTab === 'legal'">
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label fw-bold small">Raison Sociale :</label>
              <input type="text" class="form-control" v-model="form.legal_company_fr">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-bold small">Texte Footer (FR) :</label>
              <textarea class="form-control" rows="3" v-model="form.legal_footer_text_fr"></textarea>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-bold small">Texte Footer (EN) :</label>
              <textarea class="form-control" rows="3" v-model="form.legal_footer_text_en"></textarea>
            </div>
          </div>
        </div>

        <div class="d-flex justify-content-end mt-4 pt-3 border-top">
          <button type="submit" class="ds-btn ds-btn-primary" :disabled="loading">
            Enregistrer les modifications
          </button>
        </div>
      </form>
    </div>
  </div>
</template>

<!-- 4. TEMPLATE CRUD UNIFIÉ AVEC FORMULAIRES SUR-MESURE PAR RESSOURCE -->
<template id="tpl-byt3lab-crud">
  <div class="byt3lab-crud-view">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
      <div>
        <h1 class="h3 fw-bold mb-1">[[ resourceTitle ]]</h1>
        <p class="text-muted small mb-0">Gestion, édition bilingue et publication des contenus</p>
      </div>
      <div class="d-flex gap-2">
        <router-link to="/" class="ds-btn ds-btn-outline-secondary">
          &larr; Tableau de bord
        </router-link>
        <button type="button" class="ds-btn ds-btn-primary" @click="openCreate">
          + Ajouter un élément
        </button>
      </div>
    </div>

    <!-- Alertes Feedback -->
    <div v-if="successMessage" class="alert alert-success alert-dismissible fade show mb-3">
      [[ successMessage ]]
    </div>

    <!-- Liste Table -->
    <div class="ds-card p-4 shadow-sm">
      <div class="row mb-3">
        <div class="col-md-4">
          <input type="text" class="form-control form-control-sm" placeholder="Rechercher par titre, nom, slug..." v-model="searchQuery">
        </div>
      </div>

      <div class="table-responsive" v-if="items && items.length > 0">
        <table class="table align-middle">
